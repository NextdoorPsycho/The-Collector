plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

final Properties releaseSigningProperties = new Properties()
final File releaseSigningPropertiesFile = rootProject.file('key.properties')
final boolean hasReleaseSigning = releaseSigningPropertiesFile.exists()
File releaseKeystoreFile = null
if (hasReleaseSigning) {
    try {
        releaseSigningPropertiesFile.withInputStream { InputStream stream ->
            releaseSigningProperties.load(stream)
        }
    } catch (IOException ignored) {
        throw new GradleException('Could not read android/key.properties for release signing.')
    }
    final List<String> missingProperties = ['storeFile', 'storePassword', 'keyAlias', 'keyPassword'].findAll { String key ->
        final String value = releaseSigningProperties.getProperty(key)
        value == null || value.trim().isEmpty()
    }
    if (!missingProperties.isEmpty()) {
        throw new GradleException('Release signing requires these android/key.properties entries: ' + missingProperties.join(', '))
    }
    releaseKeystoreFile = rootProject.file(releaseSigningProperties.getProperty('storeFile'))
    if (!releaseKeystoreFile.isFile() || !releaseKeystoreFile.canRead()) {
        throw new GradleException('The configured release signing keystore must be a readable file.')
    }
}

android {
    namespace "com.example.model_app"
    compileSdk flutter.compileSdkVersion
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "art.arcane.the_collector"
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion flutter.targetSdkVersion
        versionCode flutter.versionCode
        versionName flutter.versionName
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile releaseKeystoreFile
                storePassword releaseSigningProperties.getProperty('storePassword')
                keyAlias releaseSigningProperties.getProperty('keyAlias')
                keyPassword releaseSigningProperties.getProperty('keyPassword')
            }
        }
    }

    buildTypes {
        release {
            signingConfig = hasReleaseSigning ? signingConfigs.release : null
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation 'com.google.mlkit:text-recognition:16.0.1'
}
