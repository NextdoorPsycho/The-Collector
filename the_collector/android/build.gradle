allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
    project.plugins.withId('com.android.library') {
        project.extensions.getByName('androidComponents').finalizeDsl { library ->
            library.compileSdk = project(':app').extensions.getByName('flutter').compileSdkVersion
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
