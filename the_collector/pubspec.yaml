name: the_collector
description: "The Collector of Everything."
publish_to: none

version: 1.0.0+1

environment:
  sdk: ^3.13.0
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  collector_models:
    path: ../collector_models
  magic_card:
    path: ../magic_card
  arcane:
    path: ../vendor/arcane
  provider: ^6.1.5+1
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  firebase_app_check: ^0.4.8
  google_sign_in: ^7.2.0
  cloud_firestore: ^6.10.0
  cloud_functions: ^6.5.0
  scryfall_api: ^2.6.0
  shared_preferences: ^2.5.6
  camera: ^0.12.1
  image_picker: ^1.2.4
  file_selector: ^1.1.0
  flutter_svg: ^2.3.0
  url_launcher: ^6.3.3
  http: ^1.6.0
  uuid: ^4.6.0
  hive: ^2.2.3
  crypto: ^3.0.7

dev_dependencies:
  camera_platform_interface: ^2.14.0
  shared_preferences_platform_interface: ^2.4.2
  image_picker_platform_interface: ^2.11.2
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  dependency_validator: ^5.1.0
  fake_cloud_firestore: ^4.3.0

dependency_overrides:
  camera_avfoundation:
    path: ../vendor/camera_avfoundation

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/ios/AppIcon~ios-marketing.png"
  remove_alpha_ios: true
  min_sdk_android: 24
  web:
    generate: true
    image_path: "assets/images/ios/AppIcon~ios-marketing.png"
    background_color: "#000000"
    theme_color: "#ffffff"
  windows:
    generate: true
    image_path: "assets/images/ios/AppIcon~ios-marketing.png"
    icon_size: 256 # min:48, max:256, default: 48
  macos:
    generate: true
    image_path: "assets/images/ios/AppIcon~ios-marketing.png"

flutter:
  assets:
    - assets/scanner_catalog/
    - assets/ding.mp3
    - assets/images/Icon.svg
    - assets/images/apple-sign-in-white.png
    - assets/images/apple-sign-in-black.png
  fonts:
    - family: itc
      fonts:
        - asset: "fonts/ITC Avant Garde Gothic Medium.otf"
    - family: akz
      fonts:
        - asset: "fonts/Berthold-akzidenz-grotesk-be-regular.ttf"

scripts:
  deploy-web: cd .. && firebase deploy --only hosting
  build-runner: cd ../collector_models && dart run build_runner build
  measure_android_size: flutter build apk --analyze-size --target-platform android-arm64
  android_signatures:
    script: ./gradlew signingReport
    directory: android
  build_appbundle_release: flutter build appbundle --release
  build_apk_release: flutter build apk --release
  validate_dependencies: dart run dependency_validator
